version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth-db
      - ALLOWED_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/product-db
    depends_on:
      - mongodb

  cart-service:
    build: ./services/cart-service
    container_name: cart-service
    ports:
      - "3003:3003"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cart-db
    depends_on:
      - mongodb

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "3004:3004"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/order-db
    depends_on:
      - mongodb

volumes:
  mongodb_data:
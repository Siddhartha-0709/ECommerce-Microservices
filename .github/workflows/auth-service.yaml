name: Build and Push Auth Service

on:
  push:
    branches:
      - main
    paths:
      - 'auth-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the application repository
      - name: Checkout application code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # 3. Create Docker Buildx builder
      - name: Set up Docker Buildx
        run: |
          docker buildx create \
            --name multiarch-builder \
            --use

      # 4. Build and push multi-architecture image
      - name: Build and Push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ github.sha }} \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest \
            --push \
            ./auth-service

      # 5. Clone GitOps repository
      - name: Checkout GitOps repository
        run: |
          git clone \
            https://${{ secrets.GITOPS_TOKEN }}@github.com/Siddhartha-0709/ECommerce-K8s-GitOps.git \
            gitops

      # 6. Update image tag in GitOps Deployment
      - name: Update GitOps Deployment
        run: |
          sed -i \
            "s|image: docker.io/siddhartha0709/auth-service:.*|image: docker.io/siddhartha0709/auth-service:${{ github.sha }}|" \
            gitops/auth-deploy/01deployment.yaml

      # 7. Commit and push GitOps change
      - name: Commit and Push GitOps change
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auth-deploy/01deployment.yaml

          git commit \
            -m "Update auth-service image to ${{ github.sha }}"

          git push

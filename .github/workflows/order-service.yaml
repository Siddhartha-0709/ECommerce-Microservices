name: Build and Push order Service

on:
  push:
    branches:
      - main
    paths:
      - 'order-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the application repository
      - name: Checkout application code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # 3. Create Docker Buildx builder
      - name: Set up Docker Buildx
        run: |
          docker buildx create \
            --name multiarch-builder \
            --use

      # 4. Build and push multi-architecture image
      - name: Build and Push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }} \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest \
            --push \
            ./order-service

      # 5. Clone GitOps repository
      - name: Checkout GitOps repository
        run: |
          git clone \
            https://${{ secrets.GITOPS_TOKEN }}@github.com/Siddhartha-0709/ECommerce-K8s-GitOps.git \
            gitops

      # 6. Update image tag in GitOps Deployment
      - name: Update GitOps Deployment
        run: |
          sed -i \
            "s|image: docker.io/siddhartha0709/order-service:.*|image: docker.io/siddhartha0709/order-service:${{ github.sha }}|" \
            gitops/order-deploy/01deployment.yaml

      # 7. Commit and push GitOps change
      - name: Commit and Push GitOps change
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add order-deploy/01deployment.yaml

          git commit \
            -m "Update order-service image to ${{ github.sha }}"

          git push
